name: Run Pipeline

on: workflow_dispatch

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
      - uses: actions/cache@v4
        id: cache-pipeline
        with:
          path: .cache
          key: pipeline-${{ github.run_id }}
          restore-keys: pipeline-
      - name: Run pipeline
        run: pixi run pipeline
